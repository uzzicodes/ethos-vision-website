<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Dark titanium metallic gradient for blades -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e33" />
      <stop offset="35%" stop-color="#14101e" />
      <stop offset="70%" stop-color="#0d0a14" />
      <stop offset="100%" stop-color="#181324" />
    </linearGradient>

    <!-- Outer barrel metal rim -->
    <radialGradient id="barrelRim" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#0d0b13" />
      <stop offset="83%" stop-color="#281e3d" />
      <stop offset="89%" stop-color="#110d1c" />
      <stop offset="94%" stop-color="#462c6d" />
      <stop offset="97%" stop-color="#1b1427" />
      <stop offset="100%" stop-color="#07050a" />
    </radialGradient>

    <!-- Purple neon glow filter -->
    <filter id="neonPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep shadow / base -->
  <circle cx="400" cy="400" r="380" fill="#050408" />

  <!-- Outer knurled lens barrel ring -->
  <circle cx="400" cy="400" r="380" fill="none" stroke="url(#barrelRim)" stroke-width="36" />
  <circle cx="400" cy="400" r="390" fill="none" stroke="rgba(181, 108, 255, 0.35)" stroke-width="2.5" />
  <circle cx="400" cy="400" r="362" fill="none" stroke="rgba(142, 60, 255, 0.45)" stroke-width="1.8" />
  <circle cx="400" cy="400" r="332" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Lens markings text along curve -->
  <path id="textPathTop" d="M 170,400 A 230,230 0 0,1 630,400" fill="none" />
  <text font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="600" fill="rgba(217, 184, 255, 0.85)" letter-spacing="8">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">CINEMATIC VISION</textPath>
  </text>

  <path id="textPathBottom" d="M 630,400 A 230,230 0 0,1 170,400" fill="none" />
  <text font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600" fill="rgba(181, 108, 255, 0.75)" letter-spacing="6">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">F / 2.8  &bull;  24-70MM  &bull;  ETHOS STUDIO</textPath>
  </text>

  <!-- Inner aperture chamber -->
  <circle cx="400" cy="400" r="300" fill="#07060b" />

  <!-- Overlapping aperture blades (rotate slowly!) -->
  <g id="apertureBladesGroup">
    
      <g transform="rotate(0 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(36 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(72 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(108 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(144 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(180 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(216 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(252 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(288 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
      <g transform="rotate(324 400 400)">
        <path d="M 400,105 C 470,120 540,200 550,285 C 500,320 420,310 330,230 C 350,170 380,125 400,105 Z"
              fill="url(#bladeGrad)" stroke="#1a1429" stroke-width="1.5" opacity="0.95" />
        <path d="M 400,105 C 470,120 540,200 550,285" fill="none" stroke="rgba(181, 108, 255, 0.45)" stroke-width="1.2" />
      </g>
    
  </g>

  <!-- Center iris aperture hole -->
  <circle cx="400" cy="400" r="85" fill="#040306" stroke="rgba(181, 108, 255, 0.55)" stroke-width="2.5" />
  <circle cx="400" cy="400" r="75" fill="#020104" />

  <!-- Purple neon accent light glints -->
  <circle cx="160" cy="220" r="3" fill="#b56cff" filter="url(#neonPurpleGlow)" opacity="0.9" />
  <circle cx="640" cy="580" r="2.5" fill="#d9b8ff" filter="url(#neonPurpleGlow)" opacity="0.8" />
  <line x1="280" y1="130" x2="310" y2="135" stroke="#b56cff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <line x1="490" y1="665" x2="520" y2="670" stroke="#b56cff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
</svg>